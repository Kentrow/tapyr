# Typical mistakes of a first configuration: each message names the fix.
apiVersion: tapyr/v1alpha1
kind: Account
metadata: { name: dashboard }
spec:
  provider: meraki
---
apiVersion: tapyr/v1alpha1
kind: Account
metadata: { name: mist }
spec:
  provider: juniper-mist
  secrets: { token: { env: TAPYR_MIST_TOKEN } }
---
apiVersion: tapyr/v1alpha1
kind: Account
metadata: { name: demo }
spec:
  provider: example-sim
  secrets: { apiKey: { env: TAPYR_EXAMPLE_API_KEY } }
---
apiVersion: tapyr/v1alpha1
kind: Job
metadata: { name: devices }
spec: { account: demo, template: example-sim-device }
---
apiVersion: tapyr/v1alpha1
kind: Output
metadata: { name: prometheus }
spec: { type: prometheus }
