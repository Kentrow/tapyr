name: Release

# A vX.Y.Z tag (or a vX.Y.Z-rc.N prerelease) releases: GoReleaser builds the
# binaries (UI embedded), the archives with their SBOM, the checksums and
# the multi-arch image ghcr.io/kentrow/tapyr; cosign signs the checksums and
# the image in keyless mode with the OIDC identity of this workflow, and
# GitHub artifact attestations record their SLSA build provenance. The
# release notes are the section of the version in CHANGELOG.md.
#
# Safety: the tagged commit must be on main and pass the tests; the UI is
# built in a job without any write permission (npm scripts never see a
# token); the release job runs in the "release" environment, which requires
# the approval of a maintainer. Actions are pinned by commit.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: The changelog has a section for the version
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Tests
        run: go vet ./... && go test -race ./...

  ui:
    name: Build the web UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: make ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui
          path: |
            ui/dist/app
            ui/dist/licenses.txt
          retention-days: 1

  release:
    name: Release
    needs: [verify, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # GitHub release
      packages: write # ghcr.io
      id-token: write # cosign keyless signing, attestations
      attestations: write # SLSA build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui
          path: ui/dist
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Release notes from CHANGELOG.md
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "v2.20.0"
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # SLSA build provenance (GitHub artifact attestations): one attestation
      # for every archive of checksums.txt, one for the image, attached to
      # its digest in the registry. The bundle of the archives is also a
      # release asset, for offline verification (gh attestation verify
      # --bundle) and for OpenSSF Scorecard.
      - name: Digest of the image
        id: image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          digest=$(docker buildx imagetools inspect "ghcr.io/kentrow/tapyr:${TAG#v}" --format '{{json .Manifest}}' | jq -r .digest)
          case "$digest" in sha256:*) ;; *) echo "no digest for ghcr.io/kentrow/tapyr:${TAG#v}" >&2; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Provenance of the archives
        id: attest-archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/kentrow/tapyr
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false # organization repositories only
      - name: Provenance of the archives as a release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest-archives.outputs.bundle-path }}
        run: |
          asset="$RUNNER_TEMP/tapyr_${TAG#v}_provenance.intoto.jsonl"
          jq -c . "$BUNDLE" > "$asset"
          gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
