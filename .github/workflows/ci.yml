name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # weekly: vulnerabilities and the release snapshot

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit; Dependabot keeps them up to date.
#
# On a pull request, the jobs that build and test the code are skipped when
# only documentation changed, and the release snapshot runs only when a file
# it depends on changed (scripts/ci-changes.sh). Pushes to main and the
# weekly run do everything. The conditions are `!cancelled()` and `!= 'true'`
# so that a failure of the classification runs the jobs instead of skipping
# them (a skipped job passes a required check).
jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      release: ${{ steps.classify.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only "origin/${BASE_REF}...${HEAD_SHA}" | ./scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          else
            printf 'docs_only=false\nrelease=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit messages
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-commits.sh "origin/${BASE_REF}..${HEAD_SHA}"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint version of the Makefile
        id: golangci
        run: echo "version=$(make -s golangci-lint-version)" >> "$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.golangci.outputs.version }}
      - name: Check for em dash characters
        run: ./scripts/check-emdash.sh
      - name: Check the documentation links and the site manifest
        run: make docs-check
      - name: Lint the built-in provider packages
        run: go run ./cmd/tapyr provider lint --catalog providers

  # The tests run in parallel jobs, the same as `make cover` together: every
  # package but cmd/tapyr, and cmd/tapyr in shards (its 24-hour acceptance
  # tests take minutes each). "Test" is the required check: it passes when
  # every test job passed, or was skipped because only documentation changed.
  test-packages:
    name: Test (packages)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check go.mod and go.sum are tidy
        run: make tidy-check
      - name: Check JSON Schemas are up to date
        run: make schema-check
      - name: Unit tests (race detector), every package but cmd/tapyr
        run: |
          go test -race -count=1 -covermode=atomic -coverprofile=coverage.out $(go list ./... | grep -v '/cmd/tapyr$')
          go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-packages
          path: coverage.out
          retention-days: 7

  test-cmd:
    name: Test (cmd/tapyr, ${{ matrix.shard }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Shards by test name: the longest 24-hour acceptance test alone
        # (about 3 minutes), the other 24-hour tests, then every other test.
        # A new test lands in a shard by its name: TestTwentyFourHours* in
        # "2/3", any other in "3/3". The names say nothing of the tests, so
        # that the checks keep their names when the slowest test changes.
        include:
          - shard: 1/3
            run: ^TestTwentyFourHoursArubaPlan$
            skip: ^$
          - shard: 2/3
            run: ^TestTwentyFourHours
            skip: ^TestTwentyFourHoursArubaPlan$
          - shard: 3/3
            run: .
            skip: ^TestTwentyFourHours
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Tests of cmd/tapyr (race detector)
        env:
          RUN: ${{ matrix.run }}
          SKIP: ${{ matrix.skip }}
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out -run "$RUN" -skip "$SKIP" ./cmd/tapyr
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-cmd-${{ strategy.job-index }}
          path: coverage.out
          retention-days: 7

  test:
    name: Test
    needs: [changes, test-packages, test-cmd]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every test job passed or was skipped
        env:
          RESULTS: changes=${{ needs.changes.result }} packages=${{ needs.test-packages.result }} cmd=${{ needs.test-cmd.result }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "${r#*=}" in
            success | skipped) ;;
            *) echo "::error::${r%%=*} ended with ${r#*=}"; exit 1 ;;
            esac
          done

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The platforms of .goreleaser.yaml, without the UI (the placeholder of
    # ui/dist is embedded): on pull requests, the release snapshot only runs
    # when a release file changed. One job per platform: the Go cache holds
    # the native build only, so each platform compiles from scratch.
    strategy:
      fail-fast: false
      matrix:
        target: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go build
        env:
          CGO_ENABLED: "0"
          TARGET: ${{ matrix.target }}
        run: GOOS=${TARGET%/*} GOARCH=${TARGET#*/} go build -trimpath -o /dev/null ./...

  # The fuzz targets run in parallel jobs; "Fuzz" gathers them, like "Test",
  # so that one check name can be required: it passes when every target
  # passed, or was skipped because only documentation changed (a skipped
  # matrix job never reports the names of its targets).
  fuzz-targets:
    name: Fuzz (${{ matrix.target }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [config:FuzzParseDocuments, collect:FuzzPagination, mapping:FuzzExtract, sim:FuzzAnonymizer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # 30 seconds per target on pull requests and main, 10 minutes weekly.
      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          FUZZTIME: ${{ github.event_name == 'schedule' && '10m' || '30s' }}
        run: go test -run '^$' -fuzz "^${TARGET#*:}\$" -fuzztime "$FUZZTIME" "./internal/${TARGET%%:*}/"
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ strategy.job-index }}
          path: internal/*/testdata/fuzz/
          retention-days: 30

  fuzz:
    name: Fuzz
    needs: [changes, fuzz-targets]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every fuzz target passed or was skipped
        env:
          RESULTS: changes=${{ needs.changes.result }} targets=${{ needs.fuzz-targets.result }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "${r#*=}" in
            success | skipped) ;;
            *) echo "::error::${r%%=*} ended with ${r#*=}"; exit 1 ;;
            esac
          done

  vulnerabilities:
    name: Vulnerabilities
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: npm audit (production dependencies of the UI)
        working-directory: ui
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: Dependency review
    # Needs the dependency graph, available on public repositories.
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  release-snapshot:
    name: Release snapshot (every platform, images)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.release != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "v2.20.2"
          args: release --snapshot --clean --skip=sign,sbom
      - name: Every binary is static
        run: |
          bins=$(jq -r '.[] | select(.type == "Binary") | .path' dist/artifacts.json)
          test -n "$bins"
          for bin in $bins; do
            go version -m "$bin" | grep -q 'CGO_ENABLED=0' || { echo "::error::$bin is not static"; exit 1; }
          done
      - name: The Homebrew cask is generated
        run: test -s dist/homebrew/Casks/tapyr.rb && ruby -c dist/homebrew/Casks/tapyr.rb
      - name: The deb and rpm packages install and run under systemd
        run: make packages-e2e
      - name: Image built from source
        run: make docker

  ui:
    name: Web UI
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Type-check, lint and test
        run: make ui-check
      - name: Build
        run: make ui
      - name: Serve the built UI, without any external reference
        run: go test -count=1 ./internal/ui/ ./cmd/tapyr/ -run 'TestHandler|TestNoExternalReferences|TestUI'

  smoke:
    name: Smoke test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: tapyr sim and tapyr run with the built binary
        run: make smoke

  helm:
    name: Helm chart
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "v4.3.1"
      - name: Lint, manifests and templates
        run: make helm-check
      - name: Install on a kind cluster against a simulator
        run: make helm-e2e

  integration:
    name: Integration (VictoriaMetrics, OpenTelemetry Collector, Prometheus)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Push outputs against real backends
        run: make integration

  alerts:
    name: Alert rules
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: promtool check and test
        run: make alerts-check
