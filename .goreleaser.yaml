# GoReleaser configuration of the releases: static binaries for Linux,
# macOS and Windows (amd64, arm64) with the web UI embedded, archives with
# their SBOM, deb and rpm packages, checksums, and the multi-arch image
# ghcr.io/kentrow/tapyr.
# The checksums and the image are signed with cosign in keyless mode (the
# OIDC identity of the release workflow). See .github/workflows/release.yml.
version: 2

project_name: tapyr

before:
  hooks:
    # The UI is built once and embedded in every binary. The release
    # workflow builds it in a job without permissions and hands it over;
    # a local snapshot builds it here.
    - sh -c 'test -f ui/dist/app/index.html || make ui'
    # The notices of the third-party software of the binary and of the UI.
    - go run ./internal/tools/licenses -ui ui/dist/licenses.txt -out THIRD_PARTY_LICENSES

builds:
  - id: tapyr
    main: ./cmd/tapyr
    binary: tapyr
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/kentrow/tapyr/internal/buildinfo.version={{ .Version }}
      - -X github.com/kentrow/tapyr/internal/buildinfo.revision={{ .ShortCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: tapyr
    ids: [tapyr]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_LICENSES
      - README.md
      - CHANGELOG.md

# deb and rpm packages of the Linux binaries, covered by the checksums, their
# signature and the provenance. The service is the unit of examples/systemd.
nfpms:
  - id: tapyr
    ids: [tapyr]
    package_name: tapyr
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: Tapyr
    homepage: https://tapyr.eu
    maintainer: Tapyr maintainers <conduct@tapyr.eu>
    description: Declarative API-to-metrics gateway that plans and spends API quota deliberately
    license: Apache-2.0
    formats: [deb, rpm]
    bindir: /usr/bin
    section: net
    contents:
      - src: examples/systemd/tapyr.service
        dst: /usr/lib/systemd/system/tapyr.service
      - dst: /etc/tapyr
        type: dir
        file_info:
          mode: 0755
      - src: packaging/config.yaml.example
        dst: /etc/tapyr/config.yaml.example
      - src: LICENSE
        dst: /usr/share/doc/tapyr/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/tapyr/NOTICE
      - src: THIRD_PARTY_LICENSES
        dst: /usr/share/doc/tapyr/THIRD_PARTY_LICENSES
    scripts:
      postinstall: packaging/postinstall.sh
      preremove: packaging/preremove.sh
      postremove: packaging/postremove.sh

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "--yes", "${artifact}"]

dockers_v2:
  - id: tapyr
    ids: [tapyr]
    dockerfile: Dockerfile.release
    extra_files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_LICENSES
    images:
      - ghcr.io/kentrow/tapyr
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: tapyr
      org.opencontainers.image.description: Declarative API-to-metrics gateway that plans and spends API quota deliberately
      org.opencontainers.image.source: https://github.com/kentrow/tapyr
      org.opencontainers.image.url: https://tapyr.eu
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
    sbom: true

docker_signs:
  - cmd: cosign
    artifacts: images
    args: ["sign", "--yes", "${artifact}@${digest}"]

# The release notes are the section of the version in CHANGELOG.md, passed by
# the release workflow with --release-notes. The changelog stays enabled: when
# disabled, GoReleaser skips the step that loads --release-notes too, and the
# release comes out without notes.

release:
  github:
    owner: kentrow
    name: tapyr
  prerelease: auto
  name_template: "v{{ .Version }}"
  # GitHub sometimes answers an upload with a 500 although the file arrived;
  # the retry then gets 422 already_exists (v0.1.1). Replace the asset
  # instead of failing, and when the release job is rerun after a failure,
  # reuse the draft it left instead of creating a second one.
  replace_existing_artifacts: true
  use_existing_draft: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"
