{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "tapyr.fullname" . }}
  labels:
    {{- include "tapyr.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "tapyr.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      honorTimestamps: true
      {{- with .Values.serviceMonitor.interval }}
      interval: {{ . }}
      {{- end }}
    - port: http
      path: /metrics/self
      {{- with .Values.serviceMonitor.interval }}
      interval: {{ . }}
      {{- end }}
{{- end }}
