apiVersion: tapyr/v1alpha1
kind: Simulation
metadata:
  name: cisco-thousandeyes
spec:
  # tapyr sim --all serves this simulator at --listen-base plus this offset.
  portOffset: 6
  # A synthetic account group: 5 tests (3 agent-to-server, 1 agent-to-agent,
  # 1 http-server) and 5 agents (3 cloud, 2 enterprise). Fields follow the
  # docs of the official SDKs (thousandeyes-sdk-python 7.0.110).
  basePath: /v7
  inventory:
    seed: 42
    sets:
      - { name: tests, count: 5 }
      - { name: agents, count: 5 }
  auth:
    accept:
      bearer: [sim-thousandeyes-token]
  headers:
    X-Organization-Rate-Limit-Limit: "limit:organization.max"
    X-Organization-Rate-Limit-Remaining: "limit:organization.remaining"
    X-Organization-Rate-Limit-Reset: "limit:organization.reset"
  routes:
    - path: /tests
      response: { template: fixtures/tests.json.tmpl }
    - path: /agents
      response: { template: fixtures/agents.json.tmpl }
    - path: /test-results/{testId}/network
      response: { template: fixtures/network.json.tmpl }
