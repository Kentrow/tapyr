apiVersion: tapyr/v1alpha1
kind: Scenario
metadata:
  name: quota-tight
  description: >-
    The organization limit at 20 requests a minute (the value of the
    documented example), another integration of the organization spending 5
    of them: Tapyr learns the limit from the header and stretches its jobs.
spec:
  steps:
    - at: 0s
      limits:
        organization: { max: 20 }
      externalConsumption: { limit: organization, ratePerHour: 300 }
