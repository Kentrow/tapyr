apiVersion: tapyr/v1alpha1
kind: Provider
metadata:
  name: strava
  version: 0.1.0
  description: Strava API v3 - the activity totals of an athlete (rides, runs, swims over 4 weeks, the year and all time), for their own dashboards
  docs: https://developers.strava.com/docs/reference/
  displayName: Strava
  categories: [sport]
  maintainers: [Kentrow]
  tier: official
  validation:
    status: simulator
    notes: Written from the Strava API documentation; the first package of the oauth2_authorization_code auth type
spec:
  baseURL: '{{ .params.baseURL | default "https://www.strava.com/api/v3" | trimSuffix "/" }}'
  params:
    - name: baseURL
      description: Base URL of the API, https://www.strava.com/api/v3 by default
    - name: oauthBaseURL
      description: Base URL of the OAuth endpoints, https://www.strava.com by default
    - name: redirectURL
      description: Redirect URL of the consent, within the Authorization Callback Domain of the application (127.0.0.1 and localhost are allowed); http://127.0.0.1:8085/callback by default
  secrets:
    - name: clientId
      required: true
      description: Client ID of your API application (strava.com/settings/api)
    - name: clientSecret
      required: true
      description: Client Secret of your API application
    - name: refreshToken
      required: true
      description: Bootstrap refresh token, written by tapyr auth login
  # OAuth 2.0 authorization code (https://developers.strava.com/docs/authentication/):
  # client id and secret in the body, comma-separated scopes, access tokens
  # valid 6 hours, and a new refresh token at every refresh, the previous one
  # invalidated at once (rotation, handled by Tapyr). PKCE is not documented.
  auth:
    type: oauth2_authorization_code
    oauth2AuthorizationCode:
      authorizeURL: '{{ .params.oauthBaseURL | default "https://www.strava.com" | trimSuffix "/" }}/oauth/authorize'
      tokenURL: '{{ .params.oauthBaseURL | default "https://www.strava.com" | trimSuffix "/" }}/oauth/token'
      redirectURL: '{{ .params.redirectURL | default "http://127.0.0.1:8085/callback" }}'
      clientId: { secret: clientId }
      clientSecret: { secret: clientSecret }
      refreshToken: { secret: refreshToken }
      scopes: [read]
      scopeSeparator: ","
      pkce: none
      authStyle: body
      authorizeParams: { approval_prompt: force }
      refreshBefore: 10m
  defaults:
    headers:
      Accept: application/json
    timeout: 15s
  # The read ("non-upload") limits apply to every endpoint this package
  # calls, and are lower than the overall limits (200 every 15 minutes, 2000
  # a day). Both are per application: accounts sharing a client id and secret
  # share them (scope credential, which leaves out the refresh token).
  limits:
    - name: read-15min
      description: Read requests per application every 15 minutes (100 by default, 200 with upgraded access); Strava resets it at 0, 15, 30 and 45 minutes past the hour, Tapyr counts it over a rolling 15 minutes, which never exceeds a fixed window
      source:
        kind: vendor-docs
        url: https://developers.strava.com/docs/rate-limits/
        date: 2026-11-27
      kind: quota
      max: 100
      window: { rolling: 15m }
      scope: { by: [credential] }
    - name: read-daily
      description: Read requests per application per day (1000 by default, 2000 with upgraded access), reset at midnight UTC
      source:
        kind: vendor-docs
        url: https://developers.strava.com/docs/rate-limits/
        date: 2026-11-27
      kind: quota
      max: 1000
      window: { period: day, resetAt: "00:00", timezone: UTC }
      scope: { by: [credential] }
  errors:
    rateLimited:
      statuses: [429]
