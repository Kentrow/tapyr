# The authenticated athlete: who the token belongs to, and the inventory of
# the stats job (the stats endpoint takes the athlete id).
apiVersion: tapyr/v1alpha1
kind: JobTemplate
metadata:
  name: strava-athlete
spec:
  provider: strava
  defaultInterval: 6h
  defaultPriority: low
  role: both
  request:
    path: /athlete
  estimate:
    pagesPerRun: 1
  extract:
    items: "[response.body]"
    inventory:
      key: string(item.id)
      fields:
        athleteId: string(item.id)
    info:
      - name: strava_athlete_info
        help: The athlete the token belongs to
        labels:
          athlete_id: string(item.id)
          username: "default(item.username, '')"
