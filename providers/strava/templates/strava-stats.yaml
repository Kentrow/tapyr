# The activity totals of the athlete (GET /athletes/{id}/stats): rides, runs
# and swims over the last 4 weeks, the year to date and all time, in meters
# and seconds. Strava counts only the activities visible to Everyone.
apiVersion: tapyr/v1alpha1
kind: JobTemplate
metadata:
  name: strava-stats
spec:
  provider: strava
  defaultInterval: 30m
  defaultPriority: normal
  forEach:
    template: strava-athlete
    vars:
      athleteId: parent.athleteId
  request:
    path: /athletes/{athleteId}/stats
  estimate:
    pagesPerRun: 1
  extract:
    # One item per period and sport, from the nine totals of the response.
    items: >-
      [['recent', 'recent'], ['ytd', 'ytd'], ['all', 'all']].map(p,
        ['ride', 'run', 'swim'].map(s, {
          'period': p[0] == 'recent' ? 'recent_4w' : p[0],
          'sport': s,
          'totals': response.body[p[1] + '_' + s + '_totals']
        })).flatten()
    filter: "has(item.totals.count)"
    metrics:
      - name: strava_activities
        help: Activities of the period and sport (recent_4w is the last 4 weeks)
        value: double(item.totals.count)
        labels: { athlete_id: vars.athleteId, period: item.period, sport: item.sport }
      - name: strava_distance_meters
        help: Distance covered in the period and sport
        unit: meters
        value: double(item.totals.distance)
        labels: { athlete_id: vars.athleteId, period: item.period, sport: item.sport }
      - name: strava_moving_time_seconds
        help: Moving time in the period and sport
        unit: seconds
        value: double(item.totals.moving_time)
        labels: { athlete_id: vars.athleteId, period: item.period, sport: item.sport }
      - name: strava_elapsed_time_seconds
        help: Elapsed time in the period and sport
        unit: seconds
        value: double(item.totals.elapsed_time)
        labels: { athlete_id: vars.athleteId, period: item.period, sport: item.sport }
      - name: strava_elevation_gain_meters
        help: Elevation gained in the period and sport (Strava reports none for swims)
        unit: meters
        value: double(item.totals.elevation_gain)
        labels: { athlete_id: vars.athleteId, period: item.period, sport: item.sport }
    post:
      - name: strava_biggest_ride_distance_meters
        help: Longest ride of the athlete
        unit: meters
        value: "double(default(responses[0].body.biggest_ride_distance, 0.0))"
        labels: { athlete_id: vars.athleteId }
      - name: strava_biggest_climb_elevation_gain_meters
        help: Biggest climb of the athlete
        unit: meters
        value: "double(default(responses[0].body.biggest_climb_elevation_gain, 0.0))"
        labels: { athlete_id: vars.athleteId }
