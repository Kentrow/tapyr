# Simulator of the Strava API v3: the athlete and its stats, behind the OAuth
# 2.0 authorization code flow with rotating refresh tokens, 6-hour access
# tokens and the read limits of provider.yaml. Synthetic data.
apiVersion: tapyr/v1alpha1
kind: Simulation
metadata:
  name: strava
spec:
  # tapyr sim --all serves this simulator at --listen-base plus this offset.
  portOffset: 8
  basePath: /api/v3
  auth:
    accept:
      authorizationCode:
        - clientId: sim-client
          clientSecret: sim-client-secret
          refreshTokens: [sim-refresh-token]
          rotate: true
    tokenLifetime: 6h
  routes:
    - path: /athlete
      response:
        file: fixtures/athlete.json
    - path: /athletes/{athleteId}/stats
      response:
        file: fixtures/stats.json
