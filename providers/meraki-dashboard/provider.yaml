apiVersion: tapyr/v1alpha1
kind: Provider
metadata:
  name: meraki-dashboard
  version: 0.1.0
  description: Cisco Meraki Dashboard API v1
  docs: https://developer.cisco.com/meraki/api-v1/
  displayName: Cisco Meraki Dashboard
  categories: [network, wireless, sd-wan]
  maintainers: [Kentrow]
  tier: official
  validation:
    status: simulator
    notes: Built from the official documentation and OpenAPI description v1.75.1; not run against a real Dashboard yet
spec:
  baseURL: '{{ .params.baseURL | default "https://api.meraki.com/api/v1" | trimSuffix "/" }}'
  params:
    - name: baseURL
      description: >-
        Base URL of the Dashboard API: https://api.meraki.com/api/v1 (default),
        or a regional one (api.meraki.ca, api.meraki.cn, api.meraki.in,
        api.gov-meraki.com)
  secrets:
    - name: apiKey
      required: true
      description: Dashboard API key (read-only administrator recommended)
  auth:
    type: bearer
    bearer:
      token: { secret: apiKey }
  # The Dashboard may redirect a request to the shard of the organization
  # (n123.meraki.com), with the API key expected there too
  # (developer.cisco.com/meraki/api-v1/authorization).
  redirects:
    hosts: ["*.meraki.com", "*.meraki.ca", "*.meraki.cn", "*.meraki.in", "*.gov-meraki.com"]
  defaults:
    headers:
      Accept: application/json
    timeout: 30s
  pagination:
    type: link_header
    linkHeader:
      pageSizeParam: perPage
      pageSize: 1000
  limits:
    - name: org-rate
      description: >-
        10 requests per second per organization, plus 10 more in the first
        second (token bucket), shared by every application of the organization
        (developer.cisco.com/meraki/api-v1/rate-limit)
      source:
        kind: vendor-docs
        url: https://developer.cisco.com/meraki/api-v1/rate-limit/
        date: 2026-11
      kind: rate
      rate: 10/s
      burst: 20
      scope: { by: ["var:organizationId"] }
      appliesTo: { requestsWithVar: organizationId }
    - name: ip-rate
      description: 100 requests per second per source IP address (developer.cisco.com/meraki/api-v1/rate-limit)
      source:
        kind: vendor-docs
        url: https://developer.cisco.com/meraki/api-v1/rate-limit/
        date: 2026-11
      kind: rate
      rate: 100/s
      scope: { by: [instance] }
    - name: ip-concurrency
      description: Concurrent requests per source IP (assumed; not documented officially, 10 is community knowledge)
      source:
        kind: assumed
      kind: concurrency
      max: 10
      scope: { by: [instance] }
  errors:
    rateLimited:
      statuses: [429]
      retryAfterHeader: Retry-After
    authFailed:
      statuses: [401]
