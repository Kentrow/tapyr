apiVersion: tapyr/v1alpha1
kind: Simulation
metadata:
  name: aruba-central-classic
spec:
  # tapyr sim --all serves this simulator at --listen-base plus this offset.
  portOffset: 0
  # A synthetic Central account: 3 sites, each with 8 access points, 2
  # switches and a gateway. Fields follow the shape of a recording of a
  # real Central account (November 2026), with synthetic values. The refresh
  # endpoint rotates the refresh tokens.
  inventory:
    seed: 42
    sets:
      - { name: sites, count: 3 }
      - { name: aps, parent: sites, count: 8 }
      - { name: switches, parent: sites, count: 2 }
      - { name: gateways, parent: sites, count: 1 }
  auth:
    accept:
      plugin:
        clients: [{ clientId: sim-client, clientSecret: sim-client-secret }]
        refreshTokens: [sim-refresh-token]
        accessTokens: [sim-access-token]
    tokenLifetime: 2h
  headers:
    X-RateLimit-Limit-day: "limit:daily.max"
    X-RateLimit-Remaining-day: "limit:daily.remaining"
  routes:
    - path: /monitoring/v2/aps
      pagination: offset
      response: { template: fixtures/aps.json.tmpl, itemsField: aps }
    - path: /monitoring/v1/switches
      pagination: offset
      response: { template: fixtures/switches.json.tmpl, itemsField: switches }
    - path: /monitoring/v1/gateways
      pagination: offset
      response: { template: fixtures/gateways.json.tmpl, itemsField: gateways }
    - path: /central/v2/sites
      pagination: offset
      response: { template: fixtures/sites.json.tmpl, itemsField: sites }
