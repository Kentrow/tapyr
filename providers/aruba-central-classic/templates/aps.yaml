apiVersion: tapyr/v1alpha1
kind: JobTemplate
metadata:
  name: aruba-aps
spec:
  provider: aruba-central-classic
  # 288 calls a day per 1000 access points out of the daily quota.
  defaultInterval: 5m
  defaultPriority: high
  request:
    path: /monitoring/v2/aps
    query:
      calculate_total: "true"
      # The client count of each access point comes with the list, at no
      # extra call.
      calculate_client_count: "true"
  estimate:
    pagesPerRun: 1
  extract:
    items: response.body.aps
    metrics:
      - name: aruba_ap_up
        help: Access point status (1 Up, 0 Down)
        value: "default(item.status, '') == 'Up'"
        labels: { serial: item.serial }
      - name: aruba_ap_clients
        help: Clients connected to the access point
        value: toFloat(item.client_count)
        labels: { serial: item.serial }
        skipIf: "!has(item.client_count) || item.client_count == null"
    info:
      - name: aruba_ap_info
        help: Descriptive attributes of an access point
        labels:
          serial: item.serial
          name: "default(item.name, '')"
          model: "default(item.model, '')"
          firmware: "default(item.firmware_version, '')"
          group: "default(item.group_name, '')"
          site: "default(item.site, '')"
    post:
      - name: aruba_aps
        help: Access points of the account
        value: "double(responses[0].body.total)"
