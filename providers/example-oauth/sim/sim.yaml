# Simulator of example-oauth: the user and its usage, behind the OAuth 2.0
# authorization code flow (immediate consent, PKCE, rotating refresh tokens,
# device code) with 6-hour access tokens. Synthetic data.
apiVersion: tapyr/v1alpha1
kind: Simulation
metadata:
  name: example-oauth
spec:
  # tapyr sim --all serves this simulator at --listen-base plus this offset.
  portOffset: 8
  basePath: /api/v1
  auth:
    accept:
      authorizationCode:
        - clientId: sim-client
          clientSecret: sim-client-secret
          refreshTokens: [sim-refresh-token]
          rotate: true
    tokenLifetime: 6h
  routes:
    - path: /me
      response:
        file: fixtures/me.json
    - path: /users/{userId}/usage
      response:
        file: fixtures/usage.json
